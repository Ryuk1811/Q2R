#:schema node_modules/wrangler/config-schema.json
name = "q2r"
main = "workers-site/index.js"
compatibility_date = "2024-09-23"
account_id = "962ddc3d77cb9f2aef9a951bf1439a79"

# Static site assets
[site]
bucket = "./dist"

# Environment variables
[vars]
ENVIRONMENT = "production"
APP_NAME = "Q2R"
SUPPORT_EMAIL = "duplexinterface@outlook.com"
R2_BUCKET_NAME = "quick-release-vault"

# R2 Bucket binding
[[r2_buckets]]
binding = "QUICK_RELEASE_BUCKET"
bucket_name = "quick-release-vault"
