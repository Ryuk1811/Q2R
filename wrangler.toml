#:schema node_modules/wrangler/config-schema.json
name = "quick-release"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"
account_id = "962ddc3d77cb9f2aef9a951bf1439a79"

# Cloudflare Pages Build Configuration
[site]
bucket = "./dist"

# Environment variables for Cloudflare Edge Functions
[vars]
ENVIRONMENT = "production"
APP_NAME = "Quick Release"
SUPPORT_EMAIL = "duplexinterface@outlook.com"
R2_BUCKET_NAME = "quick-release-vault"

# R2 Bucket binding for serverless link registry, vector QR vault, and telemetry
[[r2_buckets]]
binding = "QUICK_RELEASE_BUCKET"
bucket_name = "quick-release-vault"
